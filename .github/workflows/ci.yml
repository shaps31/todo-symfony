name: CI
on: [push, pull_request]

jobs:
  phpunit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: symfony
          coverage: none
      - name: Install deps
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare test env (sqlite)
        run: |
          echo 'APP_ENV=test' >> .env.test.local
          echo 'DATABASE_URL="sqlite:///%kernel.project_dir%/var/app_test.db"' >> .env.test.local
          echo 'MAILER_DSN="null://localhost"' >> .env.test.local
          echo 'MESSENGER_TRANSPORT_DSN="in-memory://"' >> .env.test.local
          php bin/console doctrine:database:create --env=test
          php bin/console doctrine:migrations:migrate -n --env=test
          php bin/console doctrine:fixtures:load -n --env=test
      - name: Run tests
        run: php bin/phpunit
